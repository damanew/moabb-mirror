# This is a basic workflow to help you get started with Actions

name: Mirror

# BNCI2025_001
# Yi2025
# Weibo2014
# Ofner2017
# PhysionetMI
# TrianaGuzman2024
# BNCI2014_001


# Controls when the workflow will run
on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  # 1. 并行数据处理阶段
  process-data:
    name: Process ${{ matrix.dataset }} ${{ matrix.subject.start }}-${{ matrix.subject.end }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      max-parallel: 16
      matrix:
        dataset: [
          "BNCI2025_001"
          # "Yi2025",
          # "Weibo2014",
          # "Ofner2017",
          # "PhysionetMI",
          # "TrianaGuzman2024",
          # "BNCI2014_001"
        ]
        subject: 
          - start: 0
            end: 4
          - start: 4
            end: 8
          - start: 8
            end: 12        
          - start: 12
            end: 16
          - start: 16
            end: 20
          - start: 20
            end: 24 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: astral-sh/setup-uv
        uses: astral-sh/setup-uv@v10.3.3
      - name: Setup Environment
        run: |
          echo "Setting up environment for ${{ matrix.dataset }}"
          uv init
          uv add moabb tqdm

      - name: Run Processing
        run: |
          echo "Processing dataset: ${{ matrix.dataset }}"
          uv run python -c "from moabb.datasets import ${{ matrix.dataset }}; ds=${{ matrix.dataset }}(); ds.get_data(subjects=ds.subject_list[${{ matrix.subject.start }}:${{ matrix.subject.end }}])"

      # - name: Compress mne data
      #   run: tar czvf mne_data.tar.gz ~/mne_data

      - name: Upload Artifacts 
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.dataset }}-${{ matrix.subject.start }}-${{ matrix.subject.end }}
          path: ~/mne_data # 假设输出在此目录
  # 2. 最终发布阶段
  release:
    name: Build and Push Release
    needs: [process-data]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dataset: [
          "BNCI2025_001"
          # "Yi2025",
          # "Weibo2014",
          # "Ofner2017",
          # "PhysionetMI",
          # "TrianaGuzman2024",
          # "BNCI2014_001"
        ]
    permissions:
      contents: write   # 必须保留，否则 gh release create 会失败
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
  
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: results-${{ matrix.dataset }}-*
          merge-multiple: true
          path: ./mne_data
  
      - name: Aggregate Results And Compress
        run: |
          echo "Aggregating results from all datasets and compress..."
          tar czvf ${{ matrix.dataset }}.tar.gz ./mne_data
  
      - name: Generate Version Tag
        id: tag
        run: echo "tag=v1.0.0-$(date +%Y%m%d%H%M%S)" >> $GITHUB_OUTPUT
  
      - name: Create GitHub Release (via GitHub CLI)
        env:
          GH_TOKEN: ${{ github.token }}   # gh 命令使用 GH_TOKEN 进行认证
        run: |
          gh release create "${{ steps.tag.outputs.tag }}" \
            --title "Release ${{ steps.tag.outputs.tag }}" \
            --notes "Automated release after processing all datasets.
          Datasets included: BNCI2025_001" \
            ./${{ matrix.dataset }}.tar.gz     
